name: Pull Request

on:
  push:
    branches:
      - ci/reusable-pull-request
  pull_request:
    branches:
      - main
      - alpha
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  pull_request:
    uses: algorandfoundation/algokit-shared-config/.github/workflows/node-ci.yml@chore/pnpm-ci
    with:
      node-version: 20.x
      working-directory: .
      pre-test-script: |
        pipx install algokit
        algokit localnet start
        npx --yes wait-on tcp:4001 -t 30000

      run-commit-lint: true

    # Reusable check docsss
  check_docs:
    uses: algorandfoundation/algokit-shared-config/.github/workflows/check-docs.yml@chore/pnpm-ci
