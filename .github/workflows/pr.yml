name: Pull Request

on:
  push:
    branches:
      - ci/reusable-pull-request
  pull_request:
    branches:
      - main
      - alpha
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  pull_request:
    uses: algorandfoundation/algokit-shared-config/.github/workflows/on-pull-request.yml@feat/pr-workflow
    with:
      node-version: 20.x
      working-directory: ./
      run-commit-lint: true
      run-build: true
      pre-test-script: |
        pipx install algokit
        algokit localnet start
        npx --yes wait-on tcp:4001 -t 30000
      audit-script: |
        npm run audit
      project-type: node


  ## Do we need to check docs here??
