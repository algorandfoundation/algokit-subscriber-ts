name: Pull Request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    uses: algorandfoundation/algokit-shared-config/.github/workflows/node-ci.yml@main
    with:
      run-commit-lint: true
      run-build: true
      audit-script: npm run audit
      install-algokit: true

  check_docs:
    uses: algorandfoundation/algokit-shared-config/.github/workflows/check-docs.yml@main

  verify_examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Start LocalNet
        run: |
          pipx install algokit
          algokit localnet start
          npx --yes wait-on tcp:4001 -t 30000

      - name: Install examples dependencies
        working-directory: examples/subscriber
        run: npm ci --ignore-scripts

      - name: Verify all examples
        working-directory: examples/subscriber
        run: ./verify-all.sh
