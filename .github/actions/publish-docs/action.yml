name: 'Build and Publish Documentation'
description: 'Builds Astro Starlight documentation and publishes to GitHub Pages or PR preview'
inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '20.x'
  deployment-type:
    description: 'Type of deployment: "release" or "pr-preview"'
    required: true
  pr-number:
    description: 'Pull request number (required for pr-preview deployment)'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install root dependencies
      shell: bash
      run: npm ci

    - name: Install docs dependencies
      shell: bash
      run: npm ci --prefix docs

    - name: Build documentation
      shell: bash
      run: npm run docs:build

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/dist